services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "Prueba921819!"

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Prueba921819!' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: prestamoschn-db-init

    depends_on:
      sqlserver:
        condition: service_healthy

    volumes:
      - ./database/script_CHN.sql:/scripts/script_CHN.sql:ro

    entrypoint: /bin/bash

    command:
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd
        -S sqlserver
        -U sa
        -P 'Prueba921819!'
        -C
        -i /scripts/script_CHN.sql

  app:
    build: .
    container_name: prestamoschn-app

    depends_on:
      db-init:
        condition: service_completed_successfully

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=PrestamosCHN;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "Prueba921819!"

volumes:
  sql_data: