<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicitudes de préstamo</title>

    <link rel="stylesheet" href="css/estilos.css?v=4">
</head>

<body class="pagina-solicitudes">

<header class="encabezado">

    <h1>Sistema de Préstamos CHN</h1>

    <nav class="menu">
        <a href="index.html">Inicio</a>
        <a href="clientes.html">Clientes</a>
        <a href="solicitudes.html" class="activo">Solicitudes</a>
        <a href="aprobaciones.html">Aprobaciones</a>
        <a href="plan-pagos.html">Plan de pagos</a>
        <a href="pagos.html">Pagos</a>
    </nav>

</header>

<main class="contenedor">

    <section class="tarjeta">

        <h2>Nueva solicitud de préstamo</h2>

        <div id="mensajeSolicitud" class="mensaje"></div>

        <form id="formSolicitud">

            <div class="formulario-grid">

                <div class="campo">
                    <label for="idCliente">Cliente *</label>

                    <select id="idCliente" required>
                        <option value="">Seleccione un cliente</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="montoSolicitado">
                        Monto solicitado *
                    </label>

                    <input
                            type="number"
                            id="montoSolicitado"
                            min="1"
                            step="0.01"
                            required
                    >
                </div>

                <div class="campo">
                    <label for="plazoMeses">
                        Plazo en meses *
                    </label>

                    <input
                            type="number"
                            id="plazoMeses"
                            min="1"
                            max="360"
                            required
                    >
                </div>

                <div class="campo">
                    <label for="tasaInteres">
                        Tasa de interés anual (%) *
                    </label>

                    <input
                            type="number"
                            id="tasaInteres"
                            min="0"
                            step="0.01"
                            required
                    >
                </div>

                <div class="campo">
                    <label for="fechaSolicitud">
                        Fecha de solicitud *
                    </label>

                    <input
                            type="date"
                            id="fechaSolicitud"
                            required
                    >
                </div>

                <div class="campo campo-ancho">
                    <label for="observaciones">
                        Observaciones
                    </label>

                    <textarea
                            id="observaciones"
                            maxlength="500"
                            rows="4"
                            placeholder="Ingrese observaciones adicionales"
                    ></textarea>
                </div>

            </div>

            <div class="acciones">

                <button type="submit" id="btnGuardarSolicitud">
                    Crear solicitud
                </button>

                <button type="button" id="btnNuevaSolicitud">
                    Limpiar
                </button>

            </div>

        </form>

    </section>

    <section class="tarjeta">

        <div class="titulo-tabla">

            <h2>Solicitudes registradas</h2>

            <div class="busqueda">

                <input
                        type="number"
                        id="buscarIdSolicitud"
                        min="1"
                        placeholder="Id de solicitud"
                >

                <button type="button" id="btnBuscarSolicitud">
                    Buscar
                </button>

                <button type="button" id="btnMostrarSolicitudes">
                    Mostrar todas
                </button>

            </div>

        </div>

        <div class="tabla-contenedor">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Monto solicitado</th>
                    <th>Plazo</th>
                    <th>Tasa</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th>Observaciones</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody id="tablaSolicitudes">

                <tr>
                    <td colspan="9">
                        No hay solicitudes para mostrar
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

<script src="js/solicitudes.js"></script>

</body>
</html>
